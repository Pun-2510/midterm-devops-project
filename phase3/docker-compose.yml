volumes:
  mongo_data:
  uploads_data:
  caddy_data:
  caddy_config:

services:
  app:
    image: pun0205/midterm-devops-app:phase3
    container_name: app
    expose:
      - "3000"
    env_file:
      - ../.env
    volumes:
      - type: volume
        source: uploads_data
        target: /app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: mongo
    volumes:
      - type: volume
        source: mongo_data
        target: /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
